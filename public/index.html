<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ollama Chat UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="app-title">
          <span class="logo-dot"></span>
          <h1>Ollama Chat</h1>
        </div>
        <div class="app-meta">
          <span id="model-label">Model: gpt-oss:120b</span>
        </div>
      </header>

      <main class="chat-container">
        <section id="messages" class="messages"></section>

        <form id="chat-form" class="chat-input-area">
          <div class="input-row">
            <textarea
              id="user-input"
              class="chat-input"
              rows="1"
              placeholder="Ask anything…"
            ></textarea>
            <button id="send-btn" class="send-button" type="submit">
              <span id="send-btn-label">Send</span>
            </button>
          </div>

          <div class="controls-row">
            <label class="model-select-label">
              Model
              <select id="model-select" class="model-select">
                <option value="gpt-oss:120b">gpt-oss:120b</option>
                <option value="gpt-4.1-mini">gpt-4.1-mini (if enabled)</option>
              </select>
            </label>
            <button id="clear-btn" class="secondary-button" type="button">
              Clear chat
            </button>
          </div>
        </form>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>

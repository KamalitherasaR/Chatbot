<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">

    <header class="app-header">
      <button
        id="sidebar-toggle"
        class="sidebar-toggle"
        type="button"
        aria-label="Open chat history"
      >
        ☰
      </button>

      <div class="app-title">
        <span class="logo-dot"></span>
        <h1>AI Chat</h1>
      </div>

      <span id="model-label">Model: gpt-oss:20b</span>
    </header>

    <aside class="sidebar">
      <button id="new-chat-btn" class="new-chat-btn" type="button">
        + New Chat
      </button>

      <h3>Chat History</h3>
      <div id="chat-history-list" class="chat-history-list"></div>
    </aside>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main class="chat-container">

      <section id="welcome-screen" class="welcome-screen">
        <div class="welcome-content">
          <div class="welcome-icon">✦</div>

          <h2>Hello! How can I help you today?</h2>

          <p>
            I'm your AI assistant powered by Ollama Cloud.
            Ask questions, explore ideas, or get help with coding.
          </p>

          <div class="suggestion-prompts">

            <button
              class="suggestion-btn"
              type="button"
              data-prompt="Explain a programming concept in simple words."
            >
              💡 Explain a concept
            </button>

            <button
              class="suggestion-btn"
              type="button"
              data-prompt="Help me write a professional email."
            >
              ✍️ Write an email
            </button>

            <button
              class="suggestion-btn"
              type="button"
              data-prompt="Give me some creative project ideas."
            >
              🚀 Generate ideas
            </button>

            <button
              class="suggestion-btn"
              type="button"
              data-prompt="Help me debug my JavaScript code."
            >
              💻 Help with coding
            </button>

          </div>
        </div>
      </section>

      <section id="messages" class="messages"></section>

      <form id="chat-form" class="chat-input-area">

        <div class="input-row">
          <textarea
            id="user-input"
            class="chat-input"
            rows="1"
            placeholder="Ask anything..."
          ></textarea>

          <button
            id="send-btn"
            class="send-button"
            type="submit"
          >
            <span id="send-btn-label">Send</span>
          </button>
        </div>

        <div class="controls-row">

          <label class="model-select-label">
            Model

            <select id="model-select" class="model-select">
              <option value="gpt-oss:20b">
                GPT OSS (20B Cloud)
              </option>
            </select>
          </label>

          <div class="control-buttons">

            <button
              id="clear-btn"
              class="secondary-button"
              type="button"
            >
              Clear Chat
            </button>

            <button
              id="export-chat-btn"
              class="secondary-button"
              type="button"
            >
              ⬇ Export Chat
            </button>

          </div>
        </div>

        <p class="input-note">
          Enter to send · Shift + Enter for a new line
        </p>

      </form>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="main.js"></script>

</body>
</html>
